services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mechi
      POSTGRES_PASSWORD: mechi
      POSTGRES_DB: mechi_safi
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mechi -d mechi_safi"]
      interval: 5s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    volumes: ["redis_data:/data"]
volumes:
  postgres_data:
  redis_data:
